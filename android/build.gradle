apply plugin: 'com.android.library'

group = 'expo.modules.emwdat'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// If you want to use the managed Android SDK versions from expo-modules-core, set this to true.
// The Android SDK versions will be bumped from time to time in SDK releases and may introduce breaking changes in your module code.
// Most of the time, you may like to manage the Android SDK versions yourself.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    // Simple helper that allows the root project to override versions declared by this library.
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 31)
      targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }
  }
}

android {
  namespace "expo.modules.emwdat"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

// DAT core brings fbcore 3.7; React Native may select the rest of Fresco at 3.6.
// Align the family to the highest requested version to avoid runtime ABI crashes.
rootProject.allprojects {
  dependencies.components.all { details ->
    if (details.id.group == 'com.facebook.fresco') {
      details.belongsTo("com.facebook.fresco:emwdat-fresco-platform:${details.id.version}", true)
    }
  }
}

dependencies {
  implementation "com.meta.wearable:mwdat-inputs:1.0.0"
  implementation "com.meta.wearable:mwdat-motion:1.0.0"
  implementation "com.meta.wearable:mwdat-speech:1.0.0"
  implementation "com.meta.wearable:mwdat-core:1.0.0"
  implementation "com.meta.wearable:mwdat-camera:1.0.0"
  implementation "com.meta.wearable:mwdat-display:1.0.0"
  implementation "com.meta.wearable:mwdat-mockdevice:1.0.0"
  implementation "androidx.exifinterface:exifinterface:1.3.7"
  implementation "androidx.activity:activity-ktx:1.9.0"
}
